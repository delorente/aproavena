; Aproavena · límites de subida para el panel de noticias
;
; Estos valores mandan por sobre lo que configures en el panel del hosting,
; porque .user.ini se aplica por directorio y pisa el php.ini del sistema
; (cuando PHP corre como FPM, CGI, FastCGI o LiteSpeed/lsphp).
;
; Se dejan ajustados a lo que el código realmente acepta —8 MB imágenes,
; 20 MB PDF, ver inc/upload.php— con algo de margen. Poner 256M no aporta
; nada: el servidor recibiría el archivo entero antes de que el código lo
; descarte, gastando ancho de banda y disco para nada.
;
; Los cambios tardan hasta 5 minutos en tomar efecto (user_ini.cache_ttl).

upload_max_filesize = 24M
post_max_size       = 28M   ; algo mayor: cubre el archivo mas los campos del formulario
max_file_uploads    = 20
