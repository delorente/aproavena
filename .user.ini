; Aproavena · límites de subida para el panel de noticias
;
; PHP trae upload_max_filesize en 2M por defecto, por debajo de lo que acepta
; el código (8 MB imágenes, 20 MB PDF). Una foto de celular pasa de 2 MB sin
; esfuerzo y el panel respondería "El archivo supera el tamaño máximo".
;
; Este archivo funciona cuando PHP corre como FPM, CGI o FastCGI, que es lo
; habitual en servidores con la estructura /home/dominio/public_html.
; Con mod_php NO se aplica: en ese caso hay que tocar el php.ini del sistema.
;
; Los cambios tardan hasta 5 minutos en tomar efecto (user_ini.cache_ttl).

upload_max_filesize = 20M
post_max_size       = 24M
max_file_uploads    = 20
