<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/styles.css" />
</helmet>

<dc-import name="Nav" active="directorio" hint-size="100%,84px"></dc-import>

<section class="av-container av-pt-64 av-pb-24">
  <div class="av-eyebrow av-eyebrow--wide">Directorio y socios</div>
  <h1 class="av-heading av-fs-34 av-mb-16">Empresas asociadas a Aproavena</h1>
  <p class="av-text av-mw-68ch">Estas son las empresas procesadoras de avena que integran nuestra asociación gremial, representando distintas zonas y escalas de la industria nacional.</p>
</section>

<section class="av-container av-pt-32 av-pb-90 av-stack-24">
  <sc-for list="{{ socios }}" as="s" hint-placeholder-count="5">
    <div class="av-socio" style-hover="box-shadow: 0 20px 40px -24px oklch(30% 0.05 60 / 0.4); transform: translateY(-3px);">
      <div class="av-socio__logo">
        <sc-if value="{{ s.logo }}" hint-placeholder-val="{{ true }}">
          <img src="{{ s.logo }}" alt="{{ s.name }}" style="{{ s.imgStyle }}" />
        </sc-if>
        <sc-if value="{{ s.noLogo }}" hint-placeholder-val="{{ false }}">
          <span class="av-socio__logo-text">{{ s.name }}</span>
        </sc-if>
      </div>
      <div class="av-socio__body">
        <div class="av-socio__head">
          <span class="av-socio__index">{{ s.index }}</span>
          <h2 class="av-socio__name">{{ s.name }}</h2>
        </div>
        <p class="av-socio__desc">{{ s.desc }}</p>
      </div>
    </div>
  </sc-for>
</section>

<dc-import name="Footer" hint-size="100%,220px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { name: "Empresas Gorbea", logo: "./assets/socio-eg.jpg", imgStyle: "height: 46px; width: auto; object-fit: contain;", desc: "Empresa procesadora con presencia histórica en la industria alimentaria del sur de Chile." },
      { name: "Itata", logo: "./assets/socio-itata.png", imgStyle: "height: 56px; width: auto; object-fit: contain;", desc: "Procesadora vinculada a la producción agrícola de la cuenca del Itata." },
      { name: "AEG Nutrición", logo: "./assets/socio-aeg.jpg", imgStyle: "height: 58px; width: auto; object-fit: contain;", desc: "Especialista en nutrición e ingredientes a base de avena y otros cereales." },
      { name: "Agrotop", logo: "./assets/socio-agrotop.jpg", imgStyle: "height: 46px; width: auto; object-fit: contain;", desc: "Empresa agroindustrial enfocada en el desarrollo de proveedores y productores locales." },
      { name: "Carozzi", logo: "", noLogo: true, imgStyle: "display:none;", desc: "Una de las principales empresas de alimentos de Chile, con línea de productos elaborados en base a avena." }
    ];
    const socios = raw.map((s, i) => ({ ...s, index: String(i + 1).padStart(2, "0") }));
    return { socios };
  }
}

</script>
</body>
</html>
