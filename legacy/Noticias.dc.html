<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./assets/styles.css" />
</helmet>

<dc-import name="Nav" active="noticias" hint-size="100%,84px"></dc-import>

<section class="av-container av-pt-64 av-pb-24 av-row-between">
  <div>
    <div class="av-eyebrow av-eyebrow--wide">Noticias</div>
    <h1 class="av-heading av-fs-34">Novedades del sector avenero</h1>
  </div>
  <!-- <a href="./Admin.dc.html" class="av-panel-link">Panel de socios →</a> -->
</section>

<section class="av-container av-pt-24 av-pb-90">
  <sc-if value="{{ loaded }}" hint-placeholder-val="{{ false }}">
    <div class="av-grid-3">
      <sc-for list="{{ news }}" as="item" hint-placeholder-count="3">
        <a href="{{ item.href }}" class="av-news-card">
          <img src="{{ item.cover_url }}" alt="{{ item.title }}" class="av-news-img av-news-img--180" />
          <div class="av-news-body">
            <div class="av-news-date av-mb-8">{{ item.dateLabel }}</div>
            <div class="av-news-title av-news-title--19 av-mb-10">{{ item.title }}</div>
            <p class="av-news-excerpt">{{ item.summary }}</p>
          </div>
        </a>
      </sc-for>
    </div>
  </sc-if>
</section>

<dc-import name="Footer" hint-size="100%,220px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { news: [], loaded: false };

  async componentDidMount() {
    try {
      const cfg = await import("./assets/supabase-config.js");
      const client = cfg.getClient();
      if (client) {
        const { data, error } = await client
          .from("noticias")
          .select("*")
          .eq("published", true)
          .order("published_at", { ascending: false });
        if (!error && data && data.length) {
          this.setState({ news: data, loaded: true });
          return;
        }
      }
    } catch (e) {}
    const { FALLBACK_NEWS } = await import("./assets/news-data.js");
    this.setState({ news: FALLBACK_NEWS, loaded: true });
  }

  renderVals() {
    const news = this.state.news.map(n => ({
      title: n.title,
      summary: n.summary,
      cover_url: n.cover_url || "./assets/foto-procesamiento-grano.webp",
      href: `./NoticiaDetalle.dc.html?id=${n.id}`,
      dateLabel: new Date(n.published_at).toLocaleDateString("es-CL", { day: "numeric", month: "long", year: "numeric" })
    }));
    return { news, loaded: this.state.loaded };
  }
}

</script>
</body>
</html>
